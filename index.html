<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Life</title>
<meta name="description" content="A lit character board of procedurally animated ASCII creatures.">
<meta name="theme-color" content="#030407">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCII Life">
<style>
/* Layout: one lit character board. On a desk it sits in a bezel with a nameplate above and a control rail below;
   on a phone the board is the whole screen and the rail becomes a sheet behind one button. */
:root{
  color-scheme: dark;
  --room:#030407; --bg:#04060b; --bezel:#0a0d13; --line:#1a212d;
  --ink:#a9b6c9; --ink-dim:#5a667a; --accent:#6ff2d2;
  --kb:0px;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --mono: ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--room);color:var(--ink);font:12px/1.4 var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;gap:10px;padding-block:12px;
  padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr))}

.plate{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:2;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.plate b,.sheet-head b{color:var(--ink);font-weight:600}
.pip{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.stat{font-variant-numeric:tabular-nums;min-width:0}

.stage{position:relative;flex:1;min-height:0}
#amb{position:absolute;opacity:.8;pointer-events:none}
.board{position:absolute;inset:0;border-radius:5px;background:var(--bg);overflow:hidden;cursor:crosshair;touch-action:none;
  box-shadow:0 0 0 1px var(--line),0 0 0 6px var(--bezel),0 0 0 7px var(--line)}
/* every light layer is a small canvas stretched over the board: no CSS blur, mask or blend, so it costs the same everywhere */
.board canvas{position:absolute;display:block;pointer-events:none}
#dots,#glyphs{inset:0;width:100%;height:100%}
.glass{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(112deg,transparent 0 36%,rgba(255,255,255,.03) 45%,transparent 55%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),
    radial-gradient(120% 95% at 50% 45%,transparent 58%,rgba(0,0,0,.5) 100%)}

.rail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:0 2px;position:relative;z-index:2}
.group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-right:4px}
button{font:inherit;font-size:11px;letter-spacing:.06em;color:var(--ink);background:transparent;cursor:pointer;
  border:1px solid var(--line);border-radius:3px;padding:5px 9px;min-height:28px;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:var(--ink-dim)}
button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
button .sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
button.danger{color:#ff9a9a;border-color:#5b2c2c}
button.danger:hover{border-color:#ff9a9a}
.hint{margin-left:auto;color:var(--ink-dim);font-size:11px}
.sheet-head{display:none}

.card{position:absolute;z-index:20;width:min(304px,calc(100% - 16px));display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;cursor:default;
  background:color-mix(in srgb,var(--room) 93%,transparent);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 14px 44px -14px #000}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.card label{font-size:11px;color:var(--ink-dim);line-height:1.45}
.card input{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:3px;
  padding:8px 9px;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
.card input:focus{outline:1px solid var(--accent);outline-offset:1px}
.card .row{display:flex;flex-wrap:wrap;gap:6px}
.x{border:0;min-height:24px;padding:0 6px;font-size:16px;line-height:1;color:var(--ink-dim)}
.fab{display:none;position:absolute;z-index:25;right:calc(12px + var(--sr));bottom:calc(12px + var(--sb));width:46px;height:46px;border-radius:50%;padding:0;font-size:19px;
  align-items:center;justify-content:center;background:color-mix(in srgb,var(--room) 80%,transparent)}

/* the board as the whole screen */
body.immersive .app{padding:0;gap:0}
body.immersive .plate,body.immersive #amb{display:none}
body.immersive .board{border-radius:0;box-shadow:none}
body.immersive .fab{display:flex}
body.immersive.sheet .fab{display:none}
body.immersive .rail{position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px 16px;max-height:72dvh;overflow:auto;
  padding:12px max(14px,var(--sr)) calc(14px + var(--sb)) max(14px,var(--sl));
  background:color-mix(in srgb,var(--room) 95%,transparent);border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .2s ease;visibility:hidden}
body.immersive.sheet .rail{transform:none;visibility:visible}
body.immersive .sheet-head{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
body.immersive .sheet-head .stat{margin-left:auto;letter-spacing:.06em;text-transform:none}
body.immersive .rail button{min-height:40px;padding:8px 12px;font-size:13px}
body.immersive .hint{margin-left:0;width:100%}
body.immersive .card{position:fixed;left:max(8px,var(--sl));right:max(8px,var(--sr));top:auto!important;width:auto;bottom:calc(8px + var(--sb) + var(--kb))}
body.immersive .card button{min-height:40px;padding:8px 12px;font-size:13px}
@media (max-width:720px){.plate{letter-spacing:.08em}.hint{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){body.immersive .rail{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="plate">
    <div><span class="pip"></span><b>ASCII Life</b></div>
    <div class="stat" id="stat">&nbsp;</div>
  </header>

  <div class="stage">
    <canvas id="amb"></canvas>
    <main class="board" id="board" aria-label="Animated character display">
      <canvas id="glow"></canvas>
      <canvas id="dots"></canvas>
      <canvas id="lamps"></canvas>
      <canvas id="glyphs"></canvas>
      <div class="glass"></div>

      <aside class="card" id="card" hidden aria-label="Selected creature">
        <header><span class="kind" id="card-kind">creature</span><button class="x" id="card-close" aria-label="Close">×</button></header>
        <label for="card-text">Type anything. It becomes this creature's seed and the characters it is drawn in. The same words always make the same creature.</label>
        <input id="card-text" type="text" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="a name, a word, red koi…">
        <div class="row">
          <button id="card-shuffle">Shuffle</button>
          <button id="card-copy">Copy</button>
          <button id="card-copy10">Copy ×10</button>
          <button id="card-del" class="danger">Delete</button>
        </div>
      </aside>
      <button class="fab" id="fab" aria-label="Open controls">≡</button>
    </main>
  </div>

  <footer class="rail" id="rail">
    <div class="sheet-head"><b>ASCII Life</b><span class="stat" id="stat2"></span><button class="x" id="sheet-close" aria-label="Close controls">×</button></div>
    <div class="group" role="group" aria-label="Board">
      <span class="lbl">Board</span>
      <button id="th-reef" data-theme="reef"><span class="sw" style="background:#6ff2d2"></span>Reef</button>
      <button id="th-phosphor" data-theme="phosphor"><span class="sw" style="background:#5dff8f"></span>Phosphor</button>
      <button id="th-amber" data-theme="amber"><span class="sw" style="background:#ffb347"></span>Amber</button>
      <button id="th-vfd" data-theme="vfd"><span class="sw" style="background:#59f0e6"></span>VFD</button>
    </div>
    <div class="group" role="group" aria-label="Cell size">
      <span class="lbl">Cell</span>
      <button id="cell-s" data-cell="s">S</button>
      <button id="cell-m" data-cell="m">M</button>
      <button id="cell-l" data-cell="l">L</button>
    </div>
    <div class="group" role="group" aria-label="Tank">
      <span class="lbl">Tank</span>
      <button id="add">+1</button>
      <button id="add10">+10</button>
      <button id="clear">Clear</button>
      <button id="reseed">Reseed</button>
      <button id="pause" aria-pressed="false">Pause</button>
    </div>
    <div class="group" role="group" aria-label="View">
      <span class="lbl">View</span>
      <button id="walls" aria-pressed="false">Walls</button>
      <button id="full">Full screen</button>
      <button id="install" hidden>Install</button>
    </div>
    <div class="hint" id="hint"></div>
  </footer>
</div>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
